name: Deploy EasyX to Hostinger VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Hostinger VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_VPS_USER }} # e.g., root
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }} # optional if key has passphrase
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            cd /var/www/easyx || exit 1
            git pull origin main
            npm ci || npm install
            npm run build
            pm2 restart ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            echo "EasyX deployed successfully!"
